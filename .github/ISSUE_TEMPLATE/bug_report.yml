name: 🐞 Bug report
description: Report something that isn't working in Newio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below so we can reproduce and fix it quickly.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Newio?
      description: Where did you run into the problem?
      options:
        - Desktop app
        - Mobile app
        - Web app / docs
        - CLI
        - Agent connector
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app or CLI version where you saw this (e.g. desktop 0.5.2, CLI 0.5.2). Find it in the app's about/settings or via `newio --version`.
      placeholder: "e.g. 0.5.2"
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Other / N/A
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent (if relevant)
      description: Which coding agent were you connecting? (e.g. Claude Code, Codex, Cursor)
      placeholder: "e.g. Claude Code"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant logs, error messages, or screenshots. Logs will be automatically formatted, so no need for backticks.
      render: shell
    validations:
      required: false
