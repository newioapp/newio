name: 💡 Feature request
description: Suggest an idea or improvement for Newio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Newio better? We'd love to hear it.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Newio?
      options:
        - Desktop app
        - Mobile app
        - Web app / docs
        - CLI
        - Agent connector
        - General / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false
